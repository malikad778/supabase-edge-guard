name: self-scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Examples must keep producing their known findings (every rule fires)
        run: pnpm vitest run tests/cli/e2e.test.ts -t "golden example projects"
